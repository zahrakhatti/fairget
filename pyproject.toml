[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairget"
dynamic = ["version"]
description = "Train and evaluate binary PyTorch classifiers with differentiable group-fairness constraints."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fairness", "machine-learning", "constrained-optimization", "demographic-parity", "equal-opportunity"]
authors = [{ name = "Zahra Khatti" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/zahrakhatti/fairget"
Repository = "https://github.com/zahrakhatti/fairget"
Issues = "https://github.com/zahrakhatti/fairget/issues"

[tool.setuptools.packages.find]
include = ["fairget*"]

[tool.setuptools.dynamic]
version = { attr = "fairget._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
